.screen { min-height: 100vh; padding: 18px 16px 48px; transition: background .3s; }

.t-neon .glabel { color: #ff7ae6; font-size: 12px; }

const keys = Object.keys(T);
const tabs = document.getElementById("tabs");
tabs.innerHTML = keys.map(k => `<button data-k="${k}">${T[k].tab}</button>`).join("");
function render(k) {
  const L = T[k];
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  document.getElementById("screen").className = "screen t-" + k;
  const ava = L.card ? `<div class="ava">78<small>LRN</small></div>` : `<div class="ava">C</div>`;
  const rank = L.poster ? `<span class="bounty">Kopfgeld: 30.000</span>` : L.card ? `<span>Rating 78 · ${L.title}</span>` : `<span><span class="acc">${L.rank}</span> · ${L.title}</span>`;

      <div class="who"><div class="name">Clemens</div>${rank}

    <h2>${L.worlds}</h2>
    <div class="grid">

      <button class="card wide boss"><div class="art" data-n=""></div><div class="body">${L.rar ? `<span class="rar">${L.rar[4]}</span>` : ""}<span class="cn">${L.boss[0]}</span><span class="cs">${L.boss[1]}</span></div></button>
    </div>
    <button class="choose" id="choose">${L.choose}</button>
    <p class="note">Nur eine Vorschau – die echte Lernwelt bleibt, bis du dich entschieden hast.</p>`;
  document.getElementById("choose").onclick = () => alert("Sag Papa: „" + L.tab + "“ – dann wird's gebaut.");
  try { localStorage.setItem("design-vorschau", k); } catch (e) {}
}
tabs.onclick = e => { const b = e.target.closest("button"); if (b) { render(b.dataset.k); scrollTo(0, 0); } };
let start = "neon"; try { start = localStorage.getItem("design-vorschau") || start; } catch (e) {}
render(keys.includes(start) ? start : "neon");
