<meta charset="utf-8">
<title>Clemens' Lernwelt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernwelt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Handy-Spielmenü – Erdband oben, Welten als Block-Kacheln, Spiel-Screens darunter. Bewusst nur ein (Nacht-)Look. */
:root {
  --night: #141a2b;      /* Himmel */
  --night-2: #1d2540;    /* Panels */
  --stone: #6f7480;      /* Knöpfe */
  --stone-hi: #9aa0ab;
  --stone-lo: #3d414a;
  --ink: #f4f1e6;        /* Text */
  --ink-dim: #aab0c4;
  --xp: #7be04a;         /* XP-Grün */
  --gold: #ffcc33;
  --red: #e5483b;
  --ok: #3fbf5f;
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  background-image:
    radial-gradient(2px 2px at 12% 18%, #ffffff55 50%, transparent 51%),
    radial-gradient(2px 2px at 78% 9%, #ffffff44 50%, transparent 51%),
    radial-gradient(2px 2px at 45% 32%, #ffffff33 50%, transparent 51%),
    radial-gradient(2px 2px at 90% 46%, #ffffff33 50%, transparent 51%),
    radial-gradient(2px 2px at 22% 64%, #ffffff22 50%, transparent 51%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 22px;
  line-height: 1.15;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #4a8f2c; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* Erd-/Grasband oben */
.ground {
  height: 34px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background-image: var(--tex-ground); background-size: 34px 34px; image-rendering: pixelated;
  border-bottom: 4px solid #2a1a10;
}
h1, h2, h3, .disp { font-family: var(--display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h1 { font-size: 20px; line-height: 1.4; text-shadow: 3px 3px 0 #000; }
h2 { font-size: 14px; line-height: 1.5; text-shadow: 2px 2px 0 #000; }
h3 { font-size: 11px; line-height: 1.5; }
p { margin: 0; }
.dim { color: var(--ink-dim); }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* Spieler-Leiste */
.hud { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; padding: 16px 0 6px; }
.avatar { width: 56px; height: 56px; border: 4px solid #000; background-image: var(--tex-avatar); background-size: cover; image-rendering: pixelated; }
.hud-txt { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.xpbar { height: 16px; background: #000; border: 3px solid #000; position: relative; box-shadow: 0 0 0 2px #444 inset; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--xp) 0 18px, #5cb732 18px 20px); transition: width .5s steps(10); }
.xpbar > b { position: absolute; inset: -4px 0 0; text-align: center; font-family: var(--display); font-size: 9px; color: #c9ff8a; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 20px; }
.stats span b { color: var(--gold); font-weight: 400; }

/* Hinweis-Schild */
.sign {
  background-image: var(--tex-plank); background-size: 48px 48px; image-rendering: pixelated;
  border: 4px solid #3b2410; padding: 12px 14px; color: #fff6e0; text-shadow: 2px 2px 0 #3b2410;
  box-shadow: 4px 4px 0 #000;
}
.sign .disp { font-size: 10px; display: block; margin-bottom: 6px; color: var(--gold); }

/* Welten-Kacheln */
.worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.world {
  appearance: none; border: 4px solid #000; padding: 0; cursor: pointer; text-align: left; color: var(--ink);
  background: var(--night-2); display: flex; flex-direction: column; min-width: 0; font: inherit;
  box-shadow: 4px 4px 0 #000; transition: transform .08s;
}
.world:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
.world:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.world .tex { height: 64px; background-size: 32px 32px; image-rendering: pixelated; position: relative; border-bottom: 4px solid #000; }
.world .tex .stars { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 2px; }
.world .tex .stars i { width: 16px; height: 16px; background-image: var(--px-star-off); background-size: cover; image-rendering: pixelated; }
.world .tex .stars i.on { background-image: var(--px-star); }
.world .lbl { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.world .lbl h3 { font-size: 9px; }
.world .lbl span { font-size: 18px; color: var(--ink-dim); line-height: 1; }
.world.wide { grid-column: 1 / -1; flex-direction: row; }
.world.wide .tex { width: 96px; height: auto; min-height: 76px; border-bottom: 0; border-right: 4px solid #000; flex: none; }
.world.locked { filter: grayscale(.9) brightness(.6); }
.tag { font-family: var(--display); font-size: 8px; background: var(--red); color: #fff; padding: 3px 5px; align-self: flex-start; }
.tag.y { background: var(--gold); color: #000; }

/* Inventar */
.inv { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: #8b8b8b; padding: 6px; border: 4px solid #000; box-shadow: inset 3px 3px 0 #bdbdbd, inset -3px -3px 0 #555; }
.slot { aspect-ratio: 1; max-width: 100%; background: #6b6b6b; box-shadow: inset 3px 3px 0 #444, inset -3px -3px 0 #a5a5a5; display: grid; place-items: center; }
.slot i { width: 72%; aspect-ratio: 1; background-size: cover; image-rendering: pixelated; border: 2px solid #000; }

/* Stein-Knöpfe */
.btn {
  appearance: none; font: inherit; font-family: var(--display); font-size: 11px; line-height: 1.4; color: #fff; text-shadow: 2px 2px 0 #333;
  background: var(--stone); border: 4px solid #000; padding: 14px 12px; cursor: pointer; width: 100%;
  box-shadow: inset 4px 4px 0 var(--stone-hi), inset -4px -4px 0 var(--stone-lo);
}
.btn:active { box-shadow: inset 4px 4px 0 var(--stone-lo), inset -4px -4px 0 var(--stone-hi); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.go { background: #3a8f3a; box-shadow: inset 4px 4px 0 #6cc56c, inset -4px -4px 0 #1f5a1f; }
.btn.small { width: auto; font-size: 9px; padding: 10px 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* Spiel-Screen */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 10px; }
.hearts { display: flex; gap: 3px; }
.hearts i { width: 22px; height: 20px; background-image: var(--px-heart); background-size: cover; image-rendering: pixelated; }
.hearts i.off { background-image: var(--px-heart-off); }
.prog { height: 12px; background: #000; border: 3px solid #000; margin-bottom: 16px; }
.prog > i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
.qcard { background: var(--night-2); border: 4px solid #000; box-shadow: 4px 4px 0 #000; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.qcard .kind { font-family: var(--display); font-size: 8px; color: var(--gold); letter-spacing: .08em; }
.qtext { font-size: 27px; line-height: 1.1; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  appearance: none; font: inherit; font-size: 23px; line-height: 1.05; text-align: left; color: #fff; cursor: pointer;
  background: var(--stone); border: 4px solid #000; padding: 12px 14px;
  box-shadow: inset 4px 4px 0 var(--stone-hi), inset -4px -4px 0 var(--stone-lo); text-shadow: 1px 1px 0 #333;
}
.opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt.ok { background: var(--ok); box-shadow: inset 4px 4px 0 #7de394, inset -4px -4px 0 #237a3a; }
.opt.bad { background: var(--red); box-shadow: inset 4px 4px 0 #ff8a7f, inset -4px -4px 0 #8a2219; }
.opt[disabled] { cursor: default; }
.opt[disabled]:not(.ok):not(.bad) { opacity: .5; }
.fb { border: 4px solid #000; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: #1f5a2c; }
.fb.bad { background: #6a1d17; }
.fb .disp { font-size: 11px; }
.fb .why { font-size: 21px; color: #f2eee0; }

/* Lückentext wie im Test */
.lt { font-size: 24px; line-height: 1.75; background: #f3ecd8; color: #222; border: 4px solid #000; padding: 14px; box-shadow: 4px 4px 0 #000; }
.gap {
  appearance: none; font: inherit; font-size: 21px; line-height: 1; display: inline-block; min-width: 72px; padding: 3px 6px; margin: 0 2px;
  border: 0; border-bottom: 3px solid #333; background: #e1d7bb; color: #1b3a8a; cursor: pointer; vertical-align: baseline;
}
.gap .n { font-family: var(--display); font-size: 7px; color: #6b5e3c; margin-right: 4px; vertical-align: super; }
.gap.sel { background: var(--gold); outline: 3px solid #000; }
.gap.ok { background: #a7e8b3; border-color: #1f7a33; }
.gap.bad { background: #ffb1a9; border-color: #a12a1f; }
.gap .fix { color: #1f7a33; font-size: 18px; margin-left: 4px; }
.bank { position: sticky; bottom: 0; background: var(--night); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; border-top: 4px solid #000; }
.chip { appearance: none; font: inherit; font-size: 20px; padding: 6px 9px; background: #e9d8a6; color: #2a1d08; border: 3px solid #000; box-shadow: inset -3px -3px 0 #b49b5e; cursor: pointer; }
.chip.used { opacity: .3; text-decoration: line-through; }
.chip:focus-visible { outline: 3px solid var(--gold); }

/* Ergebnis */
.result { text-align: center; align-items: center; padding-top: 26px; }
.bigstars { display: flex; gap: 8px; justify-content: center; }
.bigstars i { width: 52px; height: 52px; background-image: var(--px-star-off); background-size: cover; image-rendering: pixelated; }
.bigstars i.on { background-image: var(--px-star); animation: pop .4s steps(4) both; }
.bigstars i.on:nth-child(2) { animation-delay: .25s; } .bigstars i.on:nth-child(3) { animation-delay: .5s; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.xpgain { font-family: var(--display); font-size: 16px; color: var(--xp); text-shadow: 2px 2px 0 #000; }

.vid { width: 100%; max-width: 100%; max-height: 70vh; aspect-ratio: 9 / 16; background: #000; border: 4px solid #000; box-shadow: 4px 4px 0 #000; display: block; margin: 0 auto; object-fit: contain; }
.btn[disabled] { opacity: .55; cursor: default; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; font-family: var(--display); font-size: 11px; background: #000; color: var(--gold); border: 3px solid var(--gold); padding: 12px 14px; max-width: calc(100% - 32px); text-align: center; line-height: 1.5; }
.mini { font-size: 18px; }
.sound { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
/* Diamanten, PC-Ziel, Shop, Papa */
img.dia { width: 18px; height: auto; vertical-align: -2px; image-rendering: pixelated; }
.btn img.dia { width: 14px; vertical-align: -1px; }
.diagain { font-family: var(--display); font-size: 13px; color: #7af0e6; text-shadow: 2px 2px 0 #000; }
.pcgoal { appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; background: #0d0f1c; border: 4px solid #000; box-shadow: 4px 4px 0 #000, inset 0 0 0 2px #ff3df055; padding: 12px; width: 100%; }
.pcgoal .pcico { width: 64px; flex: none; image-rendering: pixelated; }
.pcg-txt { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.pcg-txt .disp { font-size: 10px; color: #ff7df5; }
.bar { display: block; height: 14px; background: #000; border: 3px solid #000; box-shadow: 0 0 0 2px #444 inset; }
.bar > i { display: block; height: 100%; min-width: 2px; background: linear-gradient(90deg, #7a3dff, #ff3df0); }
.big-goal { cursor: default; }
.big-goal .pcico { width: 88px; }
.sign .big, .voucher .big { font-family: var(--display); font-size: 14px; line-height: 1.6; color: #fff; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--night-2); border: 4px solid #000; box-shadow: 4px 4px 0 #000; padding: 12px 14px; }
.item h3 { font-size: 10px; margin-bottom: 6px; }
.item .btn { flex: none; }
.voucher { display: flex; flex-direction: column; gap: 10px; align-items: center; background: #f3ecd8; color: #222; border: 4px dashed #000; padding: 18px 16px; width: 100%; }
.voucher .disp { font-size: 10px; color: #8a5a2b; } .voucher .big { color: #222; }
.pin { font-family: var(--display); font-size: 26px; letter-spacing: .5em; text-align: center; padding: 14px; background: #000; color: var(--gold); border: 4px solid var(--stone); width: 100%; }
.txt { font: inherit; font-size: 22px; padding: 10px 12px; background: #0d0f1c; color: var(--ink); border: 4px solid #000; box-shadow: inset 0 0 0 2px #444; width: 100%; min-width: 0; flex: 1 1 140px; }
.log { background: #0d0f1c; border: 4px solid #000; padding: 10px 12px; font-size: 19px; display: flex; flex-direction: column; gap: 4px; }
.log b { color: #7af0e6; font-weight: 400; } .log b.neg { color: #ff8a7f; }
.guide section { background: var(--night-2); border: 4px solid #000; box-shadow: 4px 4px 0 #000; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.guide h3 { font-size: 11px; color: var(--gold); }
.guide p { font-size: 21px; line-height: 1.2; }
.guide b { color: #fff; font-weight: 400; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
.guide table { width: 100%; border-collapse: collapse; font-size: 20px; }
.guide td { padding: 6px 4px; border-bottom: 2px solid #000; vertical-align: top; }
.guide td:last-child { text-align: right; white-space: nowrap; color: #7af0e6; padding-left: 10px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== INHALT ===================== */
/* Stoff: Lückentext Frühe Neuzeit, Quiz Reformation, Hefteintrag Renaissance, Buch S. 15/16 (markiert), Arbeitsblatt Kirchenspaltung */

const LT_BANK = ["Christoph Kolumbus","1648","evangelischen","1492","Reformation","1517","1618","katholischen","Bibel","Buchdruck","95","1800","Handelsbeziehungen","1500","Kriege","Moderne","Parlament","Absolutismus"];
const LT_SENT = [
  "Die Frühe Neuzeit begann ungefähr um das Jahr [1500] und endete um [1800].",
  "Sie liegt zwischen dem Mittelalter und der [Moderne].",
  "Um 1450 erfand Johannes Gutenberg den [Buchdruck].",
  "Dadurch konnten Bücher wie die [Bibel] viel schneller und billiger verbreitet werden.",
  "Ein ganz wichtiges Ereignis war die [Reformation].",
  "Sie begann mit Martin Luthers [95] Thesen im Jahr [1517].",
  "Die Folge: eine Spaltung der [katholischen] Kirche und die Gründung der [evangelischen] Kirche.",
  "Auch [Christoph Kolumbus] veränderte die Welt, als er im Jahr [1492] Amerika erreichte.",
  "Danach gab es viele [Handelsbeziehungen] zwischen Europa, Afrika und Amerika.",
  "In Frankreich entstand der [Absolutismus] – dort hatte der König sehr viel Macht.",
  "In England dagegen bekam das [Parlament] mehr Einfluss.",
  "Es war auch eine Zeit großer [Kriege], zum Beispiel der Dreißigjährige Krieg von [1618] bis [1648]."
];

const T = (q, tf, why) => ({ q, tf, why });
const M = (q, a, why) => ({ q, a, why });

const BANKS = {
  luther: [
    M("Was geschah am 31. Oktober 1517?", ["Luther schlug 95 Thesen an eine Kirchentür.","Luther wurde Papst.","Der Reichstag zu Worms begann.","Der Augsburger Religionsfrieden wurde beschlossen."], "Am 31.10.1517 machte Luther seine 95 Thesen öffentlich – der Start der Reformation."),
    M("Was kritisierte Martin Luther besonders an der Kirche?", ["den Ablasshandel","zu viele Gottesdienste","zu wenig Kirchenmusik","das Klosterleben"], "Luther ärgerte sich am meisten über den Ablasshandel."),
    M("Was ist ein Ablassbrief?", ["ein angeblicher Erlass von Sündenstrafen gegen Geld","ein Einladungsschreiben zur Messe","ein Reiseausweis für Pilger","ein Freibrief zum Beten"], "Man zahlte Geld und bekam dafür angeblich weniger Strafe für seine Sünden."),
    M("Wie verbreiteten sich Luthers Ideen besonders schnell?", ["durch den Buchdruck","durch Brieftauben","durch Prediger zu Fuß","über das Radio"], "Dank Gutenbergs Buchdruck konnten Luthers Schriften tausendfach gedruckt werden."),
    M("Wie hieß die Verordnung, die Luther aus der Gemeinschaft ausschloss?", ["Wormser Edikt","Augsburger Interim","Wittenberger Befehl","Speyerer Erklärung"], "Das Wormser Edikt (1521) – Luther wurde damit geächtet."),
    M("Unter welchem Namen lebte Luther auf der Wartburg?", ["Junker Jörg","Ritter Rolf","Pater Paul","Bruder Till"], "Versteckt auf der Wartburg nannte er sich „Junker Jörg“."),
    M("Was bedeutet „Cuius regio, eius religio“?", ["Wessen Land, dessen Religion.","Der Papst bestimmt die Religion.","Die Bibel ist für alle da.","Jeder darf glauben, was er will."], "Der Landesherr bestimmte, welche Religion die Leute in seinem Land haben."),
    M("Welche Folge hatte die Reformation für die Kirche?", ["Es entstand eine neue Konfession: die evangelische.","Die Kirche wurde ganz abgeschafft.","Die Kirche wurde stärker.","Alle Menschen wurden katholisch."], "Die Kirche spaltete sich – neben der katholischen gab es jetzt die evangelische."),
    M("„Junker Jörg“ – wer war das?", ["Martin Luther, versteckt auf der Wartburg","ein Ritter im Dreißigjährigen Krieg","ein Papst","der Erfinder des Buchdrucks"], "Junker Jörg war Luthers Tarnname auf der Wartburg."),
    M("Wie viele Thesen veröffentlichte Luther?", ["95","12","1517","50"], "95 Thesen – merk dir: 95 Thesen im Jahr 1517."),
    T("Beim Ablasshandel konnte man sich angeblich mit Geld von Sündenstrafen freikaufen.", true, "Genau das hat Luther kritisiert."),
    T("Luthers Ideen verbreiteten sich vor allem durch Brieftauben.", false, "Falsch – durch den Buchdruck."),
  ],
  werkstatt: [
    M("Was bedeutet das Wort „Renaissance“?", ["Wiedergeburt (der Antike)","Neuer Glaube","Zeit der Ritter","Große Entdeckung"], "Renaissance = Wiedergeburt. Man entdeckte die Kunst und das Wissen der Antike neu."),
    M("Wann war die Renaissance?", ["im 15. und 16. Jahrhundert","im 12. und 13. Jahrhundert","im 18. und 19. Jahrhundert","im 10. Jahrhundert"], "Die Renaissance ist die Epoche (der Kunst) im 15. und 16. Jahrhundert."),
    M("Was bedeutet Humanismus?", ["Der Mensch steht im Mittelpunkt – Menschen sollen gebildet und klug sein.","Nur der König zählt.","Bildung ist unwichtig, nur Glaube zählt.","Die Lehre vom Krieg."], "Humanismus kommt von „menschlich“: Der Mensch steht im Mittelpunkt."),
    M("Was gewann am Übergang vom Mittelalter zur Renaissance an Bedeutung?", ["der Handel","die Ritterturniere","der Burgenbau","die Hexenjagd"], "Der Handel wurde wichtiger – und dadurch wurden Kaufleute reich."),
    M("Wer wurde durch den Handel reich?", ["die Kaufleute","die Bauern","die Mönche","die Ritter"], "Kaufleute verdienten am wachsenden Handel viel Geld."),
    M("In welchen Bereichen gab es neue Ideen?", ["Kunst, Wissenschaft und Politik","nur in der Kirche","nur beim Militär","nur in der Landwirtschaft"], "Neue Ideen gab es in Kunst, Wissenschaft und Politik."),
    T("In der Renaissance wurde das Denken wichtiger als die Religion – aber die Kirche behielt ihren Einfluss.", true, "Genau so steht es im Heft."),
    T("In der Renaissance verlor die Kirche jeden Einfluss.", false, "Falsch – die Kirche behielt ihren Einfluss."),
    M("Wie wurden Menschen in der Renaissance gemalt?", ["realistisch, auch nackt","nur als Heilige mit Goldhintergrund","nur als Strichmännchen","gar nicht – Menschen malen war verboten"], "Realistisch und auch nackt. Männer als Zeichen von Kraft und Heldentum, Frauen verführerisch."),
    M("Leonardo da Vinci war …", ["Künstler und Wissenschaftler","König von Frankreich","Papst","Seefahrer"], "Leonardo da Vinci war Künstler UND Wissenschaftler."),
    M("Warum öffnete Leonardo da Vinci Leichen?", ["Er wollte wissen, wie der Mensch innen aussieht und wie Krankheiten wirken.","Er suchte nach Gold.","Für einen Hexenprozess.","Weil der Papst es befahl."], "Er wollte verstehen, wie der Körper funktioniert und wie sich Krankheiten auswirken."),

/* Lückentext Stufe 1 (Lücke für Lücke) automatisch aus den Sätzen bauen */
(function buildLT() {
  const nums = LT_BANK.filter(w => /^\d+$/.test(w)), words = LT_BANK.filter(w => !/^\d+$/.test(w));
  const qs = [];
  LT_SENT.forEach(s => {
    const gaps = [...s.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
    gaps.forEach(g => {
      let shown = s.replace("[" + g + "]", "_____").replace(/\[([^\]]+)\]/g, "$1");
      const pool = (/^\d+$/.test(g) ? nums : words).filter(w => w !== g);
      const wrong = shuffle(pool.slice()).slice(0, 3);
      qs.push({ q: shown, a: [g, ...wrong], why: "Richtig ist: " + g, lt: true });
    });
  });
  BANKS.zeit = qs;
})();

function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  return c.toDataURL();
}

  const c = document.createElement("canvas"); c.width = rows[0].length; c.height = rows.length; const x = c.getContext("2d");

}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const $ = s => document.querySelector(s);
const app = $("#app");
const TQ = []; let tBusy = false;
function toast(msg) { TQ.push(msg); if (!tBusy) nextToast(); }
function nextToast() {
  const t = $("#toast"), m = TQ.shift();
  if (!m) { tBusy = false; t.hidden = true; return; }
  tBusy = true; t.textContent = m; t.hidden = false; setTimeout(nextToast, 2400);
}
function starsHTML(n, cls = "") { return `<span class="stars ${cls}">${[1, 2, 3].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`; }

function pinGate(title, onOk, onBack) {
  const setMode = !S.pin; let first = null;
  const draw = msg => {
    app.innerHTML = `
      <div class="topbar"><button class="btn small" id="back">Zurück</button><h2>${title}</h2></div>
      <div class="stack">
        <div class="sign"><span class="disp">${setMode ? (first ? "PIN wiederholen" : "Papa: PIN festlegen") : "Papa-PIN"}</span>${msg || (setMode ? "Leg einen 4-stelligen PIN fest, den nur du kennst. Damit bestätigst du Einlösungen und trägst Noten ein." : "Nur Papa gibt hier seinen PIN ein.")}</div>
        <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN">
        <button class="btn go" id="ok">OK</button>
      </div>`;
    const inp = $("#pin"); inp.focus();
    $("#back").onclick = onBack;
    const go = async () => {
      const v = inp.value.trim();
      if (!/^\d{4}$/.test(v)) return draw("Bitte genau 4 Ziffern.");
      if (setMode && !first) { first = v; return draw("Gib denselben PIN nochmal ein."); }
      if (setMode) { if (v !== first) { first = null; return draw("Die PINs waren verschieden. Nochmal von vorn."); } S.pin = await hashPin(v); save(); toast("PIN gespeichert"); return onOk(); }
      if (await hashPin(v) === S.pin) return onOk();
      sfx("bad"); draw("Falscher PIN.");
    };
    $("#ok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
  };
  draw();
}

/* ===================== SPIELRUNDE ===================== */
let R;
function play(world, queue, hearts) {
  R = { world, queue, i: 0, hearts, maxHearts: hearts, total: queue.length, firstTry: 0, mistakes: 0, missed: new Set(), requeued: {} };
  if (!queue.length) { toast("Nichts zu tun – alles sitzt!"); return home(); }
  question();
}
function question() {
  const q = R.queue[R.i];
  const opts = q.tf !== undefined ? ["Richtig", "Falsch"] : shuffle(q.a.slice());
  const correct = q.tf !== undefined ? (q.tf ? "Richtig" : "Falsch") : q.a[0];
  const done = Math.min(R.i, R.queue.length);
  app.innerHTML = `
    <div class="topbar"><button class="btn small" id="back">Aufgeben</button>
      <div class="hearts" aria-label="${R.hearts} Herzen">${Array.from({ length: R.maxHearts }, (_, k) => `<i class="${k < R.hearts ? "" : "off"}"></i>`).join("")}</div></div>
    <div class="prog"><i style="width:${(done / R.queue.length) * 100}%"></i></div>
    <div class="qcard">
      <span class="kind">${R.world.name.toUpperCase()} · ${done + 1}/${R.queue.length}${q.tf !== undefined ? " · RICHTIG ODER FALSCH?" : q.lt ? " · WELCHES WORT GEHÖRT IN DIE LÜCKE?" : ""}</span>
      <p class="qtext">${q.q}</p>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  $("#back").onclick = home;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b, opts[+b.dataset.k], correct, q));
  scrollTo(0, 0);
}
function answer(btn, pick, correct, q) {
  const ok = pick === correct;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add("ok"); });
  if (ok) {
    sfx("ok");
    if (!R.missed.has(q.id)) { R.firstTry++; addXP(10); }
    if (S.miss[q.id] > 0) { S.miss[q.id]--; save(); }
  } else {
    sfx("bad"); btn.classList.add("bad");
    R.hearts--; R.mistakes++; R.missed.add(q.id);
    S.miss[q.id] = (S.miss[q.id] || 0) + 1; save();
    R.requeued[q.id] = (R.requeued[q.id] || 0) + 1;
    if (R.requeued[q.id] <= 2) R.queue.push(q);
  }
  const last = R.i + 1 >= R.queue.length;
  const dead = R.hearts <= 0;
  $("#fb").innerHTML = `
    <div class="fb ${ok ? "ok" : "bad"}">
      <span class="disp">${ok ? (R.missed.has(q.id) ? "Jetzt sitzt es!" : "Richtig! +10 XP") : "Leider falsch – ein Herz weg"}</span>
      <p class="why">${q.why}${!ok ? " <span class='dim'>(Die Frage kommt nochmal.)</span>" : ""}</p>
      <button class="btn go" id="next">${dead ? "Ergebnis" : last ? "Fertig" : "Weiter"}</button>
    </div>`;
  $("#next").focus({ preventScroll: true });
  $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
  $("#next").onclick = () => { if (dead) return finish(false); R.i++; if (R.i >= R.queue.length) finish(true); else question(); };
}
function finish(alive) {
  bumpStreak();
  const w = R.world;
  let stars = 0, bonus = 0;
  if (alive) { stars = R.mistakes === 0 ? 3 : R.mistakes <= 2 ? 2 : 1; bonus = stars === 3 ? 50 : stars === 2 ? 20 : 0; }
  if (bonus) addXP(bonus);
  const prev = S.stars[w.id] || 0;
  let dia = 0;
  if (stars > prev && w.id !== "fehler" && w.id !== "boss") { dia = earnStars(w.id, prev, stars); S.stars[w.id] = stars; }
  let badge = "";
  if (stars === 3 && BADGES.find(b => b.id === w.id) && !S.badges[w.id] && w.id !== "zeit") { S.badges[w.id] = 1; badge = BADGES.find(b => b.id === w.id).name; }
  if (w.id === "boss" && alive && !S.badges.boss) { S.badges.boss = 1; badge = "Boss besiegt"; addDia(10, "Boss besiegt"); dia += 10; }
  save();
  sfx(alive ? "win" : "bad");
  app.innerHTML = `
    <div class="stack result">
      <h1>${alive ? (stars === 3 ? "PERFEKT!" : "GESCHAFFT!") : "BESIEGT!"}</h1>
      <div class="bigstars">${[1, 2, 3].map(i => `<i class="${i <= stars ? "on" : ""}"></i>`).join("")}</div>
      <p>${alive ? `${R.firstTry} von ${R.total} beim ersten Versuch richtig.` : "Keine Herzen mehr. Lies dir die Erklärungen nochmal durch und probier's gleich nochmal!"}</p>
      ${alive ? `<p class="xpgain">+${R.firstTry * 10 + bonus} XP</p>` : ""}
      ${dia ? `<p class="diagain">${DIA_IMG} +${dia} Diamanten</p>` : ""}
      ${badge ? `<div class="sign"><span class="disp">Neues Abzeichen!</span>${badge}</div>` : ""}
      ${alive && stars < 3 ? `<p class="dim">3 Sterne gibt's nur ohne Fehler. Du schaffst das!</p>` : ""}
      <div class="row" style="width:100%">
        <button class="btn" id="home">Zur Welt-Karte</button>
        <button class="btn go" id="again">Nochmal</button>
      </div>
    </div>`;
  $("#home").onclick = home;
  $("#again").onclick = () => openWorld(w.id);
  scrollTo(0, 0);
}

/* ===================== LÜCKENTEXT WIE IM TEST ===================== */
let LT;
function ltTest() {
  const gaps = []; LT_SENT.forEach(s => [...s.matchAll(/\[([^\]]+)\]/g)].forEach(m => gaps.push(m[1])));
  LT = { gaps, fill: Array(gaps.length).fill(null), sel: 0, checked: false };
  ltRender();
}
function ltRender() {
  let n = 0;
  const text = LT_SENT.map(s => s.replace(/\[([^\]]+)\]/g, () => {
    const k = n++, v = LT.fill[k];
    let cls = "gap" + (LT.sel === k && !LT.checked ? " sel" : "");
    if (LT.checked) cls += v === LT.gaps[k] ? " ok" : " bad";
    const fix = LT.checked && v !== LT.gaps[k] ? `<span class="fix">→ ${LT.gaps[k]}</span>` : "";
    return `<button class="${cls}" data-g="${k}"><span class="n">${k + 1}</span>${v || "&nbsp;"}${fix}</button>`;
  })).join(" ");
  const used = LT.fill.filter(Boolean);
  const right = LT.fill.filter((v, k) => v === LT.gaps[k]).length;
  const full = used.length === LT.gaps.length;
  app.innerHTML = `
    <div class="topbar"><button class="btn small" id="back">Zurück</button><h2>Wie im Test</h2></div>
    <div class="stack">
      <p class="dim mini">${LT.checked ? "" : "Tipp auf eine Lücke, dann auf das passende Wort. Nochmal auf die Lücke tippen macht sie leer."}</p>
      ${LT.checked ? `<div class="fb ${right === 18 ? "ok" : "bad"}"><span class="disp">${right} / 18 richtig${right === 18 ? " – PERFEKT!" : ""}</span><p class="why">${right === 18 ? "Der Lückentext sitzt. Abzeichen „Lückentext-Profi“ freigeschaltet!" : "Die roten Lücken zeigen dir das richtige Wort. Schau sie dir an und probier's nochmal."}</p></div>` : ""}
      <div class="lt">${text}</div>
      ${LT.checked ? `<div class="row"><button class="btn" id="home">Zur Welt-Karte</button><button class="btn go" id="again">Nochmal</button></div>` :
        `<button class="btn go" id="check" ${full ? "" : "disabled style='opacity:.5'"}>${full ? "Auswerten" : `Noch ${LT.gaps.length - used.length} Lücken`}</button>`}
    </div>
    ${LT.checked ? "" : `<div class="bank" aria-label="Wörterkasten">${LT_BANK.map(w => { const cnt = used.filter(u => u === w).length; return `<button class="chip ${cnt ? "used" : ""}" data-w="${w}">${w}</button>`; }).join("")}</div>`}`;
  $("#back").onclick = ltMenu;
  app.querySelectorAll(".gap").forEach(b => b.onclick = () => {
    if (LT.checked) return; const k = +b.dataset.g;
    if (LT.sel === k && LT.fill[k]) LT.fill[k] = null;
    LT.sel = k; sfx("tap"); ltRender();
  });
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    if (LT.sel == null) return;
    const w = c.dataset.w, prevIdx = LT.fill.indexOf(w);
    if (prevIdx >= 0) LT.fill[prevIdx] = null;
    LT.fill[LT.sel] = w; sfx("tap");
    const nextEmpty = LT.fill.findIndex((v, k) => !v && k > LT.sel);
    LT.sel = nextEmpty >= 0 ? nextEmpty : LT.fill.findIndex(v => !v);
    if (LT.sel < 0) LT.sel = null;
    const y = scrollY; ltRender(); scrollTo(0, y);
  });
  const ck = $("#check"); if (ck) ck.onclick = () => { if (!full) return; ltCheck(); };
  const h = $("#home"); if (h) h.onclick = home;
  const a = $("#again"); if (a) a.onclick = ltTest;
}
function ltCheck() {
  LT.checked = true;
  const right = LT.fill.filter((v, k) => v === LT.gaps[k]).length;
  LT.gaps.forEach((g, k) => { const q = BANKS.zeit.find(x => x.a[0] === g && LT.fill[k] !== g); if (q) { S.miss[q.id] = (S.miss[q.id] || 0) + 1; } });
  bumpStreak();
  addXP(right * 5 + (right === 18 ? 100 : 0));
  S.ltBest = Math.max(S.ltBest, right);
  const stars = right === 18 ? 3 : right >= 16 ? 2 : right >= 12 ? 1 : 0;
  const prev = S.stars.zeit || 0;
  if (stars > prev) { const n = earnStars("zeit", prev, stars); S.stars.zeit = stars; later(() => toast("+" + n + " Diamanten!")); }
  if (right === 18 && !S.badges.zeit) S.badges.zeit = 1;
  save(); sfx(right === 18 ? "win" : "bad");
  ltRender(); scrollTo(0, 0);
}

home();
</script>
